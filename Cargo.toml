[workspace]
resolver = "2"
members = [
    "crates/morsh-core",
    "crates/morsh-transport",
    "crates/morsh-auth",
    "crates/morsh-term",
    "crates/morsh-predict",
    "crates/morsh-tunnel",
    "crates/morshd",
    "crates/morsh",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["morsh contributors"]
description = "Modern remote terminal and shell over QUIC with roaming, predictive echo, and stealth auth"
repository = "https://github.com/fokx/morsh"
homepage = "https://github.com/fokx/morsh"
documentation = "https://docs.rs/morsh"
readme = "README.md"
keywords = ["quic", "ssh", "mosh", "terminal", "pty"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Internal workspace crates
morsh-core = { version = "0.2.0", path = "crates/morsh-core" }
morsh-transport = { version = "0.2.0", path = "crates/morsh-transport" }
morsh-auth = { version = "0.2.0", path = "crates/morsh-auth" }
morsh-term = { version = "0.2.0", path = "crates/morsh-term" }
morsh-predict = { version = "0.2.0", path = "crates/morsh-predict" }
morsh-tunnel = { version = "0.2.0", path = "crates/morsh-tunnel" }

# External async / networking dependencies
tokio = { version = "1.43", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rcgen = "0.14"
ring = "0.17"

# Serialization & wire framing
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
bytes = "1.10"
toml = "0.8"

# CLI & Observability
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Terminal & PTY
portable-pty = "0.9"
crossterm = { version = "0.28", features = ["event-stream"] }
vt100 = "0.15"
futures-util = "0.3"
